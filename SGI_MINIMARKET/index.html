<!-- Reproductor de música ambiental flotante -->
<audio id="musicaFondo" loop>
  <source src="img/jazz-timer.mp3" type="audio/mpeg">
</audio>

<button id="btnMusica" onclick="toggleMusica()" style="
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;
  background-color: #1f2937;
  color: #ffffff;
  border: none;
  border-radius: 50px;
  padding: 12px 20px;
  font-size: 14px;
  font-family: sans-serif;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
">
  🎵 Activar música
</button>

<script>
  const audio = document.getElementById("musicaFondo");
  const boton = document.getElementById("btnMusica");
  audio.volume = 0.4;

  function toggleMusica() {
    if (audio.paused) {
      audio.play();
      boton.innerHTML = "⏸️ Pausar música";
    } else {
      audio.pause();
      boton.innerHTML = "🎵 Activar música";
    }
  }
</script>
