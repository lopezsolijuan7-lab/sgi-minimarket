

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>SGI Minimarket | Login</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="login-container">

    <div class="logo">🛒</div>

    <h1>SGI MINIMARKET</h1>

    <p class="subtitulo">
      Sistema de Gestión de Inventario
    </p>

    <h2>Iniciar sesión</h2>

    <form id="loginForm">

      <label for="correo">
        Correo electrónico
      </label>

      <input
        type="email"
        id="correo"
        placeholder="Ingrese su correo"
        autocomplete="username"
        required
      >

      <label for="password">
        Contraseña
      </label>

      <input
        type="password"
        id="password"
        placeholder="Ingrese su contraseña"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="btnIngresar">
        Ingresar al sistema
      </button>

      <p id="mensaje" role="status"
         aria-live="polite"></p>

    </form>

    <p class="pie">
      Acceso exclusivo para personal autorizado
    </p>

  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
