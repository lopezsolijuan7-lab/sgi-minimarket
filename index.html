<style>
  #reproductorNoir {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
    background-color: #1c1f26;
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 50px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45);
    font-family: system-ui, -apple-system, sans-serif;
    opacity: 0.35;
    transition: opacity 0.3s ease, transform 0.2s ease;
    user-select: none;
  }

  #reproductorNoir:hover {
    opacity: 1;
    transform: translateY(-2px);
  }

  .disco-vinilo {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: radial-gradient(circle, #1c1f26 18%, #f59e0b 20%, #d97706 70%, #1c1f26 72%);
    border: 2px solid #f59e0b;
    flex-shrink: 0;
  }

  .girando {
    animation: girarDisco 4s linear infinite;
  }

  @keyframes girarDisco {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  #btnPlayPause {
    background-color: #10b981;
    color: #ffffff;
    border: none;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
</style>

<audio id="musicaFondo" loop preload="auto">
  <source src="img/jazz-timer.mp3" type="audio/mpeg">
</audio>

<div id="reproductorNoir">
  <div id="discoVinilo" class="disco-vinilo"></div>
  <div>
    <div style="font-size: 10px; color: #f59e0b; font-weight: bold; letter-spacing: 1px;">NOIR JAZZ LOUNGE</div>
    <div style="font-size: 14px; font-weight: bold;">Just One More Drink</div>
    <div style="font-size: 11px; color: #9ca3af;">Late Night Sax & Piano</div>
  </div>
  <button type="button" id="btnPlayPause" aria-label="Reproducir o pausar música">▶</button>
</div>

<script>
  const pistaAudio = document.getElementById("musicaFondo");
  const cajaReproductor = document.getElementById("reproductorNoir");
  const botonPlay = document.getElementById("btnPlayPause");
  const disco = document.getElementById("discoVinilo");
  pistaAudio.volume = 0.5;

  cajaReproductor.addEventListener("click", function () {
    if (pistaAudio.paused) {
      pistaAudio.play();
      botonPlay.textContent = "⏸";
      disco.classList.add("girando");
    } else {
      pistaAudio.pause();
      botonPlay.textContent = "▶";
      disco.classList.remove("girando");
    }
  });
</script>
